<text x="40" y="798" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="normal" fill="#182b43">Solid: audio transcription to text. Dashed: task-dependent image and speech branches.</text>
<text x="40" y="842" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="normal" fill="#182b43">A batch groups model work; it is not the same as client concurrency or a separate process.</text>
<text x="40" y="887" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="normal" fill="#182b43">This configuration diagram reports no durations, GPU utilization, or bottleneck conclusions.</text>
